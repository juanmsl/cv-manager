name: Lint, type check and build

# Only on pull requests: changes reach main through pull requests, which already ran these checks.
on:
  pull_request:

concurrency:
  group: lint-typecheck-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check and build
    runs-on: ubuntu-latest
    env:
      # None of these checks need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      # pnpm from "packageManager" in package.json and Node.js from .nvmrc (24);
      # the pnpm store is cached between runs.
      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo runs lint and typecheck in every app (desktop and website);
      # --continue reports all failures instead of stopping at the first one.
      - name: Lint and type check
        run: pnpm turbo run lint typecheck --continue

      - name: Build
        run: pnpm turbo run build
