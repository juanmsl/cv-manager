name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check and build
    runs-on: ubuntu-latest
    env:
      # None of these checks need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # uses the version pinned in package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo runs lint and typecheck in every app (desktop and website);
      # --continue reports all failures instead of stopping at the first one.
      - name: Lint and type check
        run: pnpm turbo run lint typecheck --continue

      - name: Build
        run: pnpm turbo run build
