name: Deploy website

# Publishes apps/website to GitHub Pages at https://cv-manager.juanmsl.com (ADR-0022)
# on every push to main that changes the website, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

# One deployment at a time; a running deployment is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the website doesn't need Electron
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version pinned in package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@cv-manager/website

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
